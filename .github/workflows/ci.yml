name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify Gitleaks and scan the checkout
        shell: bash
        run: |
          set -euo pipefail
          gitleaks_dir="$(mktemp -d "$RUNNER_TEMP/gitleaks.XXXXXX")"
          curl --fail --location --silent --show-error --retry 3 --proto '=https' --tlsv1.2 \
            'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz' \
            --output "$gitleaks_dir/gitleaks.tar.gz"
          # Verified against the official v8.30.1 release asset and checksum file.
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' \
            "$gitleaks_dir/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$gitleaks_dir/gitleaks.tar.gz" -C "$gitleaks_dir" gitleaks
          # Built-in rules exclude .git; this scans the current checkout, not history.
          "$gitleaks_dir/gitleaks" dir --redact=100 --no-banner --no-color --exit-code=1 --timeout=300 .

  sheets:
    name: Google Sheets connector tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test all connector helpers with mocked Google services
        run: node --test sheets/*.test.cjs

  android:
    name: Android build, JVM tests, and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate the Gradle wrapper JAR
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Install the required Android SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;35.0.0"'
      - name: Run JVM tests, lint, and compile app and device tests
        # Device tests are compiled here; running them needs an emulator or device.
        run: bash ./gradlew --no-daemon --console=plain :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest
